<title>מצבת הצוות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky header with the day's headcount, bottom tab bar; screens swap in place. Field-notebook olive + khaki. */
:root {
  --bg: #F1F2EC;
  --surface: #FFFFFF;
  --surface-2: #E7E9DF;
  --ink: #1C2118;
  --muted: #5F6657;
  --line: #D3D7C8;
  --accent: #46572A;
  --accent-ink: #FFFFFF;
  --khaki: #8B6F47;
  --ok: #2C7442; --ok-bg: #DCEEDD;
  --warn: #9A6200; --warn-bg: #F8E8C4;
  --bad: #B3261E; --bad-bg: #F7D9D5;
  --home: #9A5B13; --home-bg: #F4E4CE;
  --course: #2D5C86; --course-bg: #DBE7F2;
  --nir: #62645E; --nir-bg: #E3E4DF;
  --off: #ECEDE7;
  --shadow: 0 1px 2px rgba(28,33,24,.08), 0 4px 16px rgba(28,33,24,.06);
  --f-display: "Rubik", "Assistant", system-ui, sans-serif;
  --f-body: "Assistant", "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15180F; --surface: #1F2418; --surface-2: #2A3021; --ink: #E8EADF; --muted: #A3A995; --line: #3A4130;
  --accent: #A9C17A; --accent-ink: #15180F; --khaki: #C9A878;
  --ok: #7FCB91; --ok-bg: #1E3A25; --warn: #E8B25A; --warn-bg: #3E3018; --bad: #F08A80; --bad-bg: #47201C;
  --home: #E2A35B; --home-bg: #3D2C17; --course: #8DB8E0; --course-bg: #1C2E40; --nir: #B0B2AA; --nir-bg: #2D2F2A;
  --off: #1A1E14; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15180F; --surface: #1F2418; --surface-2: #2A3021; --ink: #E8EADF; --muted: #A3A995; --line: #3A4130;
  --accent: #A9C17A; --accent-ink: #15180F; --khaki: #C9A878;
  --ok: #7FCB91; --ok-bg: #1E3A25; --warn: #E8B25A; --warn-bg: #3E3018; --bad: #F08A80; --bad-bg: #47201C;
  --home: #E2A35B; --home-bg: #3D2C17; --course: #8DB8E0; --course-bg: #1C2E40; --nir: #B0B2AA; --nir-bg: #2D2F2A;
  --off: #1A1E14; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 14px; }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--f-body); font-weight: 600; font-size: .78rem; opacity: .8; letter-spacing: .04em; }
.now { text-align: left; }
.now b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.now span { display: block; font-size: .78rem; opacity: .85; }

main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.notice { background: var(--warn-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }

/* tabs */
.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.tab[aria-current="page"] { background: var(--surface-2); color: var(--ink); }

/* section headings */
h2 { font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; margin: 0; text-wrap: balance; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.fab { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: var(--shadow); }

/* summary strip */
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 1.4rem; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }

/* calendar */
.month { display: grid; gap: 8px; }
.month h2 { padding-inline: 2px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cell { min-height: 64px; border-radius: 10px; padding: 5px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid transparent; background: var(--off); color: var(--muted); font-size: .8rem; }
.cell.blank { background: transparent; }
.cell.res { background: var(--surface); color: var(--ink); border-color: var(--line); cursor: pointer; }
.cell.res .cnt { font-family: var(--f-display); font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 1px 5px; line-height: 1.3; }
.cell.res .cnt small { font-size: .65rem; opacity: .75; }
.cell .partial { font-size: .62rem; color: var(--muted); }
.cell.today { outline: 2px solid var(--khaki); outline-offset: -2px; }
.ok { color: var(--ok); background: var(--ok-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: -1px; }

/* day view */
.dayhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.dayhead h2 { text-align: center; font-size: 1.15rem; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; border-radius: 12px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: .9rem; }
.timeline { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); direction: ltr; }
.timeline div { display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; font-family: var(--f-display); min-width: 0; overflow: hidden; }
.ticks { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); direction: ltr; }
.seglist { display: grid; gap: 4px; font-size: .9rem; }
.seglist div { display: flex; justify-content: space-between; gap: 8px; }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.item .who { font-weight: 700; }
.item .meta { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.item button { flex: none; }
.chip { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.c-home { color: var(--home); background: var(--home-bg); }
.c-course { color: var(--course); background: var(--course-bg); }
.c-nir { color: var(--nir); background: var(--nir-bg); }
.c-present { color: var(--ok); background: var(--ok-bg); }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.names span { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 2px 9px; font-size: .88rem; font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.copybox { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface-2); }

/* soldiers */
.srow { display: grid; grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: right; }
.srow .bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; display: flex; direction: rtl; }
.srow .bar i { display: block; height: 100%; }
.srow .n { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .82rem; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--bad); font-size: .88rem; font-weight: 600; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,8,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; display: grid; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.rangerow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.muted { color: var(--muted); }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 20px 8px; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .srow { grid-template-columns: minmax(0, 5.5rem) minmax(0, 1fr) auto; } .cell { min-height: 56px; } .cell.res .cnt { font-size: .9rem; padding: 1px 3px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); } } }
.reportbox { white-space: pre-wrap; margin: 0; background: var(--surface-2); border-radius: 10px; padding: 12px; font-family: var(--f-body); font-size: .98rem; line-height: 1.6; overflow-wrap: anywhere; }
a.btn { text-decoration: none; display: inline-block; text-align: center; }
.btn.wa { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.gcal { display: grid; gap: 6px; }
/* duty roster */
.mchip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 3px 8px; font-size: .86rem; font-weight: 600; line-height: 1.35; }
button.mchip { cursor: pointer; }
.mchip .rb { display: inline-flex; gap: 2px; }
.mchip i, .pick i { font-style: normal; font-size: .68rem; font-weight: 700; color: var(--accent); background: var(--surface-2); border-radius: 4px; padding: 0 3px; }
.mchip.locked { border-color: var(--khaki); }
.mchip.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.mchip.free { background: transparent; color: var(--muted); border-style: dotted; font-weight: 500; }
.mchip.empty-slot { border-style: dashed; color: var(--bad); background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.srow2 { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.htable { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.hrow { display: grid; grid-template-columns: 3.4rem minmax(0, 7rem) minmax(0, 1fr); gap: 6px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--line); }
.hrow.hhead { border-top: 0; background: var(--surface-2); font-size: .78rem; font-weight: 700; color: var(--muted); }
.probs { background: var(--bad-bg); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: .88rem; }
.probs ul { margin: 4px 0 0; padding-inline-start: 18px; }
.daylist { display: grid; gap: 6px; }
.dayrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.dlink { border: 0; background: transparent; text-align: right; display: grid; gap: 0; padding: 2px; min-width: 0; }
.seg.small button { padding: 4px 8px; font-size: .8rem; }
.ftable { width: 100%; border-collapse: collapse; font-size: .88rem; }
.ftable th, .ftable td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.ftable th { color: var(--muted); font-size: .78rem; }
.picklist .pick { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; text-align: right; }
.picklist .pick:disabled { opacity: .5; cursor: not-allowed; }
.diff { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.diff li { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
.diff .plus { color: var(--ok); } .diff .minus { color: var(--bad); }
.vday summary { cursor: pointer; padding: 2px 0; }
.roles { display: flex; flex-wrap: wrap; gap: 4px; }
.roles button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 8px; font-size: .75rem; font-weight: 700; color: var(--muted); }
.roles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.solrow { display: grid; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface-2); }
body.viewer .tabs, body.viewer .fab { display: none; }
body.viewer main { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 420px) { .dayrow { grid-template-columns: minmax(0, 1fr) auto; } .dayrow .chip { grid-column: 1 / -1; justify-self: start; } .hrow { grid-template-columns: 3rem minmax(0, 6rem) minmax(0, 1fr); } }
</style>

<header class="top"><div class="top-in">
  <div class="brand">מצבת הצוות<small>ניהול כוח אדם · מילואים</small></div>

</div></header>

<main id="app"><div class="empty">טוען נתונים…</div></main>

  <button class="tab" data-tab="cal">לוח</button>
  <button class="tab" data-tab="soldiers">לוחמים</button>
  <button class="tab" data-tab="report">דוח 1</button>
  <button class="tab" data-tab="sched">שבצ״ק</button>
  <button class="tab" data-tab="settings">הגדרות</button>
</div></nav>

<div id="modal"></div>
<div id="smodal"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const TYPES = { home: "בבית", course: "קורס", nir: "לא במילואים" };
const TYPE_CLS = { home: "c-home", course: "c-course", nir: "c-nir" };
const PRIORITY = { nir: 3, course: 2, home: 1 };
const REASONS = ["יציאה", "מחלה", "אישי", "לימודים", "אחר"];
const DOW = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
const DOW_LONG = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
const MONTHS = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

/* ---------- state ---------- */
const S = {
  soldiers: [], absences: [], settings: null,
  loaded: { soldiers: false, absences: false, settings: false },
  tab: "cal", day: null, soldier: null, sort: "out",
  notice: "", cache: null, copyText: null
};
let db = null;

/* ---------- date helpers (all local time) ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dOf(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(key, n) { const d = dOf(key); d.setDate(d.getDate() + n); return keyOf(d); }
function ms(s) { const [d, t = "00:00"] = s.split("T"); const [h, mi] = t.split(":").map(Number); const x = dOf(d); x.setHours(h, mi, 0, 0); return x.getTime(); }
const short = key => { const d = dOf(key); return `${d.getDate()}.${d.getMonth() + 1}`; };
const longDate = key => { const d = dOf(key); return `יום ${DOW_LONG[d.getDay()]}, ${d.getDate()} ב${MONTHS[d.getMonth()]}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayKey = () => keyOf(new Date());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ltr = s => "\u2066" + s + "\u2069";
const span2 = (a, b) => ltr(`${a}–${b}`);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- derived data ---------- */
function settings() { return S.settings || { reserveRanges: [], minStrength: 15 }; }
function activeSoldiers() { return S.soldiers.filter(s => s.active !== false); }
function reserveDays() {
  const set = new Set();
  for (const r of settings().reserveRanges || []) {
    if (!r.from || !r.to || r.to < r.from) continue;
    for (let k = r.from; k <= r.to; k = addDays(k, 1)) set.add(k);
  }
  return [...set].sort();
}
function statusCls(n) { const m = Number(settings().minStrength) || 0; return n < m ? "bad" : n === m ? "warn" : "ok"; }

function dayInfo(key) {
  const s0 = ms(key), s1 = ms(addDays(key, 1));
  const per = activeSoldiers().map(sol => {
    const abs = S.absences.filter(a => a.soldierId === sol.id && ms(a.start) < s1 && ms(a.end) > s0);
    const full = abs.filter(a => ms(a.start) <= s0 && ms(a.end) >= s1).sort((a, b) => PRIORITY[b.type] - PRIORITY[a.type])[0] || null;
    return { sol, full, partial: full ? [] : abs };
  });
  const pts = new Set([s0, s1]);
  per.forEach(p => p.partial.forEach(a => { pts.add(Math.max(s0, ms(a.start))); pts.add(Math.min(s1, ms(a.end))); }));
  const sorted = [...pts].sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const t = sorted[i];
    const n = per.filter(p => !p.full && !p.partial.some(a => ms(a.start) <= t && ms(a.end) > t)).length;
    const last = segs[segs.length - 1];
    if (last && last.n === n) last.t1 = sorted[i + 1]; else segs.push({ t0: t, t1: sorted[i + 1], n });
  }
  const min = segs.length ? Math.min(...segs.map(s => s.n)) : per.length;
  return { key, s0, s1, per, segs, min, total: per.length, hasPartial: per.some(p => p.partial.length) };
}
function cache() {
  if (!S.cache) { const days = reserveDays(); S.cache = { days, info: new Map(days.map(k => [k, dayInfo(k)])) }; }
  return S.cache;
}
function presentNow() {
  const k = todayKey(); const info = cache().info.get(k); if (!info) return null;
  const t = Date.now();
  const n = info.per.filter(p => !p.full && !p.partial.some(a => ms(a.start) <= t && ms(a.end) > t)).length;
  return { n, total: info.total };
}
function soldierStats(id) {
  const st = { home: 0, course: 0, nir: 0, partial: 0, present: 0 };
  for (const info of cache().info.values()) {
    const p = info.per.find(x => x.sol.id === id); if (!p) continue;
    if (p.full) st[p.full.type]++; else { st.present++; if (p.partial.length) st.partial++; }
  }
  return st;
}
function absRangeText(a) {
  if (a.allDay) { const from = a.start.slice(0, 10), to = addDays(a.end.slice(0, 10), -1); return from === to ? short(from) : span2(short(from), short(to)); }
  const f = a.start.slice(0, 10), t = a.end.slice(0, 10);
  return f === t ? `${short(f)} · ${span2(a.start.slice(11), a.end.slice(11))}` : `${ltr(short(f) + " " + a.start.slice(11))} עד ${ltr(short(t) + " " + a.end.slice(11))}`;
}
function absDays(a) { let n = 0; for (const k of cache().days) { if (ms(a.start) <= ms(k) && ms(a.end) >= ms(addDays(k, 1))) n++; } return n; }
const nameOf = id => (S.soldiers.find(s => s.id === id) || {}).name || "לוחם שהוסר";
const reasonText = a => a.type === "home" ? [a.reason, a.note].filter(Boolean).join(" · ") : (a.note || "");

function renderNow() {
  const el = document.getElementById("now");
  if (!S.loaded.soldiers) { el.innerHTML = ""; return; }
  if (!S.isOwner) { el.innerHTML = `<span>צפייה בלבד</span>`; return; }

  const next = cache().days.find(k => k > todayKey());
  if (next) { const diff = Math.round((dOf(next) - dOf(todayKey())) / 864e5); el.innerHTML = `<b>${diff}</b><span>ימים ליום מילואים הבא (${short(next)})</span>`; }

function viewCal() {
  const { days, info } = cache();
  if (!activeSoldiers().length && !days.length) return emptyState();
  const tk = todayKey();
  const done = days.filter(k => k < tk).length;
  const lows = days.filter(k => info.get(k).min < Number(settings().minStrength)).length;
  let out = `<div class="strip">
    <div class="stat"><b>${activeSoldiers().length}</b><span>סד״כ</span></div>
    <div class="stat"><b>${days.length}</b><span>ימי מילואים${done ? ` · עברו ${done}` : ""}</span></div>
    <div class="stat"><b style="color:var(${lows ? "--bad" : "--ok"})">${lows}</b><span>ימים מתחת ל־${esc(settings().minStrength)}</span></div>
  </div>`;
  if (!days.length) return out + `<div class="panel empty">עוד לא הוגדרו ימי מילואים. אפשר להוסיף אותם במסך ההגדרות.</div>`;
  const months = [...new Set(days.map(k => k.slice(0, 7)))];
  for (const m of months) {
    const [y, mo] = m.split("-").map(Number);
    const first = new Date(y, mo - 1, 1), count = new Date(y, mo, 0).getDate();
    let cells = DOW.map(d => `<div class="dow">${d}</div>`).join("");
    for (let i = 0; i < first.getDay(); i++) cells += `<div class="cell blank"></div>`;
    for (let d = 1; d <= count; d++) {
      const k = `${m}-${pad(d)}`, inf = info.get(k), today = k === tk ? " today" : "";
      if (inf) cells += `<button class="cell res${today}" data-day="${k}" aria-label="${longDate(k)}: ${inf.min} מתוך ${inf.total}">
          <span>${d}</span><span class="cnt ${statusCls(inf.min)}">${inf.min}<small>/${inf.total}</small></span>${inf.hasPartial ? `<span class="partial">שעות</span>` : ""}</button>`;
      else cells += `<div class="cell${today}">${d}</div>`;
    }
    out += `<section class="month"><h2>${MONTHS[mo - 1]} ${y}</h2><div class="grid">${cells}</div></section>`;
  }
  out += `<div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>מעל המינימום</span><span><i style="background:var(--warn-bg);border:1px solid var(--warn)"></i>בדיוק במינימום</span><span><i style="background:var(--bad-bg);border:1px solid var(--bad)"></i>מתחת למינימום</span><span>המספר הוא הנוכחות הנמוכה ביותר באותו יום · "שעות" = יש יציאה לפי שעות</span></div>`;
  return out;
}

function viewDay() {

  const clip = (a) => span2(hm(Math.max(inf.s0, ms(a.start))), Math.min(inf.s1, ms(a.end)) === inf.s1 ? "24:00" : hm(ms(a.end)));

function whatsappText(key) {

  for (const t of ["home", "course", "nir"]) {
    const arr = inf.per.filter(p => p.full && p.full.type === t);
    if (arr.length) { L.push("", `${TYPES[t]} (${arr.length}):`); arr.forEach(p => L.push(`• ${p.sol.name}${reasonText(p.full) ? " – " + reasonText(p.full) : ""}`)); }
  }

    part.forEach(p => p.partial.forEach(a => L.push(`• ${p.sol.name} ${span2(hm(Math.max(inf.s0, ms(a.start))), Math.min(inf.s1, ms(a.end)) === inf.s1 ? "24:00" : hm(ms(a.end)))}${reasonText(a) ? " – " + reasonText(a) : ""}`)));
  }
  const present = inf.per.filter(p => !p.full);
  L.push("", `נוכחים (${present.length}): ${present.map(p => p.sol.name).join(", ")}`);
  return L.join("\n");
}

/* ---------- attendance report ---------- */
function reportAt(t) {
  const key = keyOf(new Date(t)); const info = cache().info.get(key);
  if (!info) return null;
  const missing = [];
  for (const p of info.per) {
    const a = p.full || p.partial.find(x => ms(x.start) <= t && ms(x.end) > t);
    if (!a) continue;
    let text;
    if (a.type === "course") text = "קורס";
    else if (a.type === "nir") text = "לא במילואים";
    else {
      const endKey = a.end.slice(0, 10), why = [a.reason, a.note].filter(Boolean).join(", ");
      text = p.full ? "בבית" : `בבית עד ${endKey === key ? a.end.slice(11) : short(endKey) + " " + a.end.slice(11)}`;
      if (why) text += ` (${why})`;
    }
    missing.push({ name: p.sol.name, text });
  }
  return { key, t, total: info.total, present: info.total - missing.length, missing };
}

  else { L.push("לא נוכחים:"); r.missing.forEach((m, i) => L.push(`${i + 1}. ${m.name} – ${m.text}`)); }
  return L.join("\n");
}

/* ==== SCHEDULER ENGINE START ==== */
/* Pure scheduling engine (no DOM, no db). Builds, repairs, edits and validates the duty roster.
   Mission day = 07:00 -> 07:00 next day (format v2). Older v1 days (06:30) are kept as they were.
   Times are local "YYYY-MM-DDTHH:MM" strings. */
const SCHED = (() => {
  const P2 = n => String(n).padStart(2, "0");

  const dO = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const plusDays = (k, n) => { const d = dO(k); d.setDate(d.getDate() + n); return kOf(d); };
  const T = s => { const [d, t = "00:00"] = s.split("T"); const [h, mi] = t.split(":").map(Number); const x = dO(d); x.setHours(h, mi, 0, 0); return x.getTime(); };

  const HOUR = 3600000;
  const V = 2, START = "07:00", MID = "19:00";
  const ROLE = { commander: "commander", david: "davidDriver", tigris: "tigrisDriver", lead: "carmelALead" };
  const ROLE_LABEL = { commander: "מפקד", davidDriver: "נהג דוד", tigrisDriver: "נהג טיגריס", carmelALead: "אברג׳יל/אביאל" };
  const KIND_LABEL = { carmelA: "כרמל חוץ מוצב", patrol: "סיור", carmelB: "כרמל פנים מוצב", guard: "עמדה אחורית", kitchen: "תורן מטבח" };
  // group rules: size, minimum per role, maximum per role
  const SPEC = {
    carmelA: { size: 8, reqs: [{ r: ROLE.lead, n: 1 }, { r: ROLE.tigris, n: 1 }], caps: {} },
    patrol: { size: 8, reqs: [{ r: ROLE.lead, n: 1 }, { r: ROLE.commander, n: 2 }, { r: ROLE.david, n: 2 }], caps: { [ROLE.commander]: 2 } },
    carmelB: { reqs: [{ r: ROLE.commander, n: 1 }], caps: {} },
  };

  const hourOf = t => new Date(t).getHours();

    const n = plusDays(key, 1);
    let t = [];
    if (type === "post") t = [["carmelA", `${key}T${START}`, `${key}T${MID}`], ["carmelA", `${key}T${MID}`, `${n}T${START}`]];
    if (type === "patrol") t = [["patrol", `${key}T${START}`, `${key}T${MID}`], ["patrol", `${key}T${MID}`, `${n}T${START}`]];
    if (!from) return t;

  // old documents (v1: guard / guardLocked) -> current shape (guards[] / gLocked[]); never mutates the input
  function normalize(d) {
    if (!d) return null;
    const x = JSON.parse(JSON.stringify(d));
    if (x.v !== V) x.v = 1;
    x.shifts = (x.shifts || []).map(s => ({ ...s, members: s.members || [], locked: s.locked || [] }));
    x.hours = (x.hours || []).map(h => {
      const guards = Array.isArray(h.guards) ? h.guards : (h.guard ? [h.guard] : []);
      const gLocked = Array.isArray(h.gLocked) ? h.gLocked : (h.guardLocked && h.guard ? [h.guard] : []);

  function makeCtx(input) {

  }
  function bookInner(c, id, t0, t1) { const st = c.stats[id]; if (!st) return; st.B += (t1 - t0) / HOUR; st.load += 0.3 * (t1 - t0) / HOUR; }
  const scarcity = (c, id) => [ROLE.lead, ROLE.tigris, ROLE.commander, ROLE.david].reduce((n, r) => n + (has(c, id, r) ? 15 : 0), 0);

  // Pick a group of n from cands: locked first, then `keep` (repair), then by score; role minimums and caps enforced.
  function pickGroup(c, n, cands, spec, score, locked, keep, block) {
    const reqs = (spec && spec.reqs) || [], caps = (spec && spec.caps) || {};
    const inC = new Set(cands);
    let members = [...new Set(locked || [])].filter(id => inC.has(id)).slice(0, n);
    const lockedSet = new Set(members);
    const keepValid = [...new Set(keep || [])].filter(id => inC.has(id) && !members.includes(id));
    const room = n - members.length;
    if (keepValid.length > room) { // over capacity (someone moved in / smaller slot): keep the fairest, original order
      const best = new Set([...keepValid].sort((a, b) => score(a) - score(b)).slice(0, Math.max(0, room)));
      members.push(...keepValid.filter(id => best.has(id)));
    } else members.push(...keepValid);
    const cnt = r => members.filter(id => has(c, id, r)).length;
    const pool = () => cands.filter(id => !members.includes(id)).sort((a, b) => score(a) - score(b));
    const neededFor = id => reqs.some(q => has(c, id, q.r) && cnt(q.r) <= q.n);
    for (const q of reqs) {
      while (cnt(q.r) < q.n) {
        const cand = pool().find(id => has(c, id, q.r)); if (!cand) break;
        if (members.length >= n) {
          const removable = members.filter(id => !lockedSet.has(id) && !neededFor(id)).sort((a, b) => score(b) - score(a));
          if (!removable.length) break;
          members = members.filter(x => x !== removable[0]);
        }
        members.push(cand);
      }
    }
    // enforce caps (e.g. exactly 2 commanders in a patrol): drop extra unlocked holders not needed for another minimum
    for (const [r, m] of Object.entries(caps)) {
      while (cnt(r) > m) {
        const drop = members.filter(id => !lockedSet.has(id) && has(c, id, r) && !reqs.some(q => q.r !== r && has(c, id, q.r) && cnt(q.r) <= q.n)).sort((a, b) => score(b) - score(a))[0];
        if (!drop) break; members = members.filter(x => x !== drop);
      }
    }
    const capped = id => Object.entries(caps).some(([r, m]) => has(c, id, r) && cnt(r) >= m);
    for (const id of pool()) { if (members.length >= n) break; if (capped(id) || (block && block(id, members))) continue; members.push(id); }
    for (const id of pool()) { if (members.length >= n) break; if (capped(id)) continue; members.push(id); }
    return members;
  }

  // book an existing (kept as-is) day into the fairness stats
  function bookDay(c, key, d) {
    const [d0, d1] = dayWindow(key, d.v);
    if (d.kitchen && c.stats[d.kitchen]) { c.stats[d.kitchen].kitchen += 1; c.stats[d.kitchen].load += 4; c.stats[d.kitchen].kitchenEnd = dayWindow(key, d.v)[1]; }
    for (const sh of d.shifts) for (const id of sh.members) book(c, id, T(sh.start), T(sh.end), sh.kind === "carmelA" ? "A" : "patrol");
    for (const h of d.hours) { const t = T(h.start), te = Math.min(t + HOUR, d1); h.guards.forEach(id => book(c, id, t, te, "guard")); h.carmelB.forEach(id => bookInner(c, id, t, te)); }
    return d0;
  }

  function buildDay(c, key, type, prev, mode) {
    const doc = { v: V, type, kitchen: null, kitchenLocked: false, shifts: [], hours: [] };
    const from = prev && prev.v === V && prev.startAt ? prev.startAt : null;
    if (from) doc.startAt = from;
    if (type !== "post" && type !== "patrol") return doc;
    const d1 = dayWindow(key, V)[1], d0 = dayStart(key, doc);
    const same = !!prev && prev.type === type && prev.v === V;
    const frozen = t => t < c.now;
    const repair = mode === "repair";
    // manual (locked) placements win: never pick someone for a slot that clashes with where he was locked
    const lockedIn = (t0, t1, opt) => {
      const out = new Set(); if (!same) return out;
      for (const sh of prev.shifts) if (T(sh.start) < t1 && T(sh.end) > t0) sh.locked.forEach(x => out.add(x));
      for (const h of prev.hours) {
        const a = T(h.start); if (!(a < t1 && a + HOUR > t0)) continue;
        if (!(opt && opt.kitchen && kitchenMayGuard(a, V))) h.gLocked.forEach(x => out.add(x));
        if (!(opt && opt.allowB)) h.bLocked.forEach(x => out.add(x));
      }
      return out;
    };

    // kitchen duty (whole day)
    const pk = same ? prev.kitchen : null, pkLocked = same && !!prev.kitchenLocked;
    const k0 = Math.max(d0, Math.min(c.now, d1)); // a day in progress only needs cover for its remaining part
    if (same && frozen(d0) && pk && free(c, pk, k0, d1)) { doc.kitchen = pk; doc.kitchenLocked = pkLocked; }
    else {
      const midDay = same && frozen(d0);
      const runningNow = new Set(midDay ? [...prev.shifts.filter(x => T(x.start) <= c.now && T(x.end) > c.now).flatMap(x => x.members), ...prev.hours.filter(h => T(h.start) <= c.now && T(h.start) + HOUR > c.now).flatMap(h => h.guards)] : []);
      const laterToday = new Set(midDay ? [...prev.shifts.filter(x => T(x.start) > c.now).flatMap(x => x.members), ...prev.hours.filter(h => T(h.start) > c.now).flatMap(h => h.guards)] : []);
      const lockedToday = lockedIn(k0, d1, { allowB: true, kitchen: true });
      const cands = c.ids.filter(id => free(c, id, k0, d1) && !busyAt(c, id, k0, k0 + 1) && !runningNow.has(id) && (id === pk || !lockedToday.has(id)));
      if (pk && cands.includes(pk) && (pkLocked || repair)) { doc.kitchen = pk; doc.kitchenLocked = pkLocked; }
      else {
        // never take someone whose role the day's missions cannot do without
        const need = id => {
          let p = 0;
          for (const [kind, s, e] of template(key, type, d0)) for (const q of SPEC[kind].reqs) {
            if (!has(c, id, q.r)) continue;
            const others = c.ids.filter(o => o !== id && has(c, o, q.r) && free(c, o, T(s), T(e))).length;
            p += others < q.n ? 10000 : others < q.n * 2 ? 300 : 0;
          }
          return p;
        };
        const sc = id => need(id) + (laterToday.has(id) ? 500 : 0) + c.stats[id].kitchen * 100 + c.stats[id].load + scarcity(c, id) + tb(id, key + "k");
        doc.kitchen = cands.sort((a, b) => sc(a) - sc(b))[0] || null;
      }
    }
    if (doc.kitchen && c.stats[doc.kitchen]) { c.stats[doc.kitchen].kitchen += 1; c.stats[doc.kitchen].load += 4; c.stats[doc.kitchen].kitchenEnd = d1; }

    // outer post (carmel A) shifts / patrols
    template(key, type, d0).forEach(([kind, s, e], i) => {
      const t0 = T(s), t1 = T(e), spec = SPEC[kind], n = SIZE[kind];
      const ps = same ? prev.shifts[i] : null;
      const locked = ps ? ps.locked : [];
      const score = id => {
        const st = c.stats[id];
        let v = st.load + (kind === "carmelA" ? st.A : st.patrol) * 0.5 + tb(id, s);
        if (st.lastEnd && t0 - st.lastEnd < 6 * HOUR) v += 200; // avoid back-to-back
        if (st.kitchenEnd && t0 >= st.kitchenEnd && t0 - st.kitchenEnd < 8 * HOUR) v += 300; // just came off kitchen
        return v;
      };
      // a further holder of a required role is only taken if others remain for the next shift / the inner post
      const block = (id, mem) => {
        for (const q of spec.reqs) if (has(c, id, q.r) && mem.filter(m => has(c, m, q.r)).length >= q.n) return true;
        return false;
      };
      let members;
      if (ps && frozen(t0)) {
        members = [...ps.members];
        if (t1 > c.now && (members.length !== n)) { // a running shift changed size: trim / refill for the rest of it
          const w0 = Math.max(t0, c.now);
          const elsewhere = lockedIn(w0, t1);
          for (const h of prev.hours) { const a = T(h.start); if (a < c.now && a < t1 && a + HOUR > t0) { h.guards.forEach(x => elsewhere.add(x)); h.carmelB.forEach(x => elsewhere.add(x)); } }
          const cands = c.ids.filter(id => members.includes(id) || (id !== doc.kitchen && free(c, id, w0, t1) && !busyAt(c, id, w0, t1) && !elsewhere.has(id)));
          members = pickGroup(c, n, cands, spec, score, locked, members, block);
        }
      } else {
        const elsewhere = lockedIn(t0, t1); locked.forEach(x => elsewhere.delete(x));
        const cands = c.ids.filter(id => id !== doc.kitchen && free(c, id, t0, t1) && !busyAt(c, id, t0, t1) && !elsewhere.has(id));
        members = pickGroup(c, n, cands, spec, score, locked, repair && ps ? ps.members : [], block);
      }
      members.forEach(id => book(c, id, t0, t1, kind === "carmelA" ? "A" : "patrol"));
      doc.shifts.push({ kind, start: s, end: e, members, locked: locked.filter(id => members.includes(id)) });
    });

    // post day: hourly rear position (1 by day, 2 at night). Never two hours in a row; as much spacing as possible.
    if (type === "post") {
      let i = 0;
      for (let t = d0; t < d1; t += HOUR, i++) {
        const te = Math.min(t + HOUR, d1), s = fmt(t), hs = hourSpec(t, V);
        const ph = same ? prev.hours[i] : null, pn = same ? prev.hours[i + 1] : null;
        const sh = doc.shifts.find(x => T(x.start) <= t && T(x.end) > t);
        const A = sh ? sh.members : [];
        const kOk = kitchenMayGuard(t, V);
        const prevG = i ? doc.hours[i - 1].guards : [];
        let G = [];
        const running = ph && frozen(t);
        const clean = ph && ph.guards.length === hs.guards && !ph.guards.some(x => A.includes(x) || (x === doc.kitchen && !kOk));
        if (running && (te <= c.now || clean)) G = [...ph.guards];
        else {
          const keepIt = (repair || running) && ph;
          const w0 = running ? Math.max(t, c.now) : t;
          const nextLocked = new Set(pn ? pn.gLocked : []);
          // hard rule: nobody guards two hours in a row (previous hour, or locked for the next hour)
          const gc = c.ids.filter(id => !A.includes(id) && free(c, id, w0, te) && !busyAt(c, id, w0, te)
            && (id !== doc.kitchen || kOk) && !(prevG.includes(id) && !(ph && ph.gLocked.includes(id))) && !(nextLocked.has(id) && !(ph && ph.gLocked.includes(id))));
          const gScore = id => {
            const st = c.stats[id];
            const since = st.lastEnd ? (t - st.lastEnd) / HOUR : 48;          // rest since last mission
            const sinceG = st.lastGuard ? (t - st.lastGuard) / HOUR : 48;     // since last guard
            const nextBusy = st.busy.filter(([a]) => a >= te).reduce((m, [a]) => Math.min(m, a), Infinity);
            const untilNext = nextBusy === Infinity ? 48 : (nextBusy - te) / HOUR;   // until next known mission
            let v = st.guard * 6 + st.load * 0.4 + tb(id, s + "g");
            v -= Math.min(sinceG, 24) * 25 + Math.min(since, 12) * 10 + Math.min(untilNext, 8) * 15; // spacing
            if (sinceG < 3) v += 400;
            v += doc.hours.reduce((n, h) => n + (h.guards.includes(id) ? 1 : 0), 0) * 70; // spread guards within the day
            if (st.kitchenEnd && t >= st.kitchenEnd && t - st.kitchenEnd < 8 * HOUR) v += (8 - (t - st.kitchenEnd) / HOUR) * 120; // just came off kitchen
            return v;
          };
          G = pickGroup(c, hs.guards, gc, null, gScore, ph ? ph.gLocked : [], keepIt ? ph.guards : [], null);
        }
        G.forEach(id => book(c, id, t, te, "guard"));
        doc.hours.push({ start: s, guards: G, gLocked: (ph ? ph.gLocked : []).filter(id => G.includes(id)), carmelB: [], bLocked: [] });
      }
    }
    return doc;
  }

  /* input: { soldiers:[{id,name,active,roles}], absences:[{soldierId,start,end}], days:[key], dayTypes:{key:type}, now }
     existing: { key: doc }  mode: "rebuild" (keep only locked + past) | "repair" (keep every still-valid assignment)
     opts.rebuildAfter = key: days after `key` are rebuilt for fairness (locks and past kept), the rest repaired. */
  function buildAll(input, existing, mode, opts) {
    const c = makeCtx(input), docs = {};
    const after = opts && opts.rebuildAfter;
    for (const key of [...(input.days || [])].sort()) {
      const type = (input.dayTypes && input.dayTypes[key]) || "post";
      const prev = normalize(existing && existing[key]);
      if (prev && prev.v !== V) {
        // old-format day: keep it untouched if it has already started, otherwise rebuild it under the new rules
        if (dayWindow(key, 1)[0] < c.now) { bookDay(c, key, prev); docs[key] = existing[key]; continue; }
        docs[key] = buildDay(c, key, type, null, "rebuild"); continue;
      }
      if (!prev && dayWindow(key, V)[1] <= c.now) continue; // never invent a roster for days already over
      docs[key] = buildDay(c, key, type, prev, after && key > after ? "rebuild" : (mode || "repair"));
    }
    return { docs, stats: c.stats };
  }

  /* ---------- editing (manual changes that ripple through the roster) ---------- */
  // Every slot of a day as { ref, kind, t0, t1, label } (ref: "k" | "s|i" | "g|i" | "b|i").
  function slotsOf(key, day) {
    const d = normalize(day), out = [];
    if (!d || (d.type !== "post" && d.type !== "patrol")) return out;
    const d1 = dayWindow(key, d.v)[1], d0 = dayStart(key, d);
    out.push({ ref: "k", kind: "kitchen", t0: d0, t1: d1, label: KIND_LABEL.kitchen });
    d.shifts.forEach((sh, i) => out.push({ ref: `s|${i}`, kind: sh.kind, t0: T(sh.start), t1: T(sh.end), label: `${KIND_LABEL[sh.kind]} ${sh.start.slice(11)}–${sh.end.slice(11)}` }));
    d.hours.forEach((h, i) => {
      const t0 = T(h.start), t1 = Math.min(t0 + HOUR, d1), hh = h.start.slice(11);
      out.push({ ref: `g|${i}`, kind: "guard", t0, t1, label: `עמדה ${hh}`, size: hourSpec(t0, d.v).guards });
    });
    return out;
  }
  function holders(day, ref) {
    const d = day.hours && day.hours[0] && !Array.isArray(day.hours[0].guards) ? normalize(day) : day;
    const [k, i] = ref.split("|");
    if (k === "k") return d.kitchen ? [d.kitchen] : [];
    if (k === "s") return d.shifts[+i].members || [];
    if (k === "g") return d.hours[+i].guards || [];
    return d.hours[+i].carmelB || [];
  }
  // may one person hold slot kinds a and b at overlapping times?
  function compatible(a, b, v) {
    const pair = [a.kind, b.kind].sort().join("+");
    if (pair === "carmelB+kitchen") return true;
    if (pair === "guard+kitchen") return kitchenMayGuard((a.kind === "guard" ? a : b).t0, v);
    return false;
  }
  function removeFrom(d, ref, id) {
    const [k, i] = ref.split("|");
    if (k === "k") { if (d.kitchen === id) { d.kitchen = null; d.kitchenLocked = false; } return; }
    if (k === "s") { const sh = d.shifts[+i]; sh.members = sh.members.filter(x => x !== id); sh.locked = sh.locked.filter(x => x !== id); return; }
    const h = d.hours[+i];
    if (k === "g") { h.guards = h.guards.filter(x => x !== id); h.gLocked = h.gLocked.filter(x => x !== id); return; }
    h.carmelB = h.carmelB.filter(x => x !== id); h.bLocked = h.bLocked.filter(x => x !== id);
  }
  // Put `id` into slot `ref` (replacing `replaceId` if given), lock it, and take `id` out of every other
  // not-yet-finished slot of the day that clashes with it. Freed places are refilled by buildAll.
  function assignInDay(key, day, ref, id, replaceId, now) {
    const d = normalize(day);
    const all = slotsOf(key, d), target = all.find(x => x.ref === ref);
    if (!target) return d;
    for (const sl of all) {
      if (sl.ref === ref || sl.t1 <= now || !holders(d, sl.ref).includes(id)) continue;
      const overlap = sl.t0 < target.t1 && sl.t1 > target.t0;
      if (overlap && !compatible(target, sl, d.v)) removeFrom(d, sl.ref, id);
    }
    const [k, i] = ref.split("|");
    if (replaceId) removeFrom(d, ref, replaceId);
    if (k === "k") { d.kitchen = id; d.kitchenLocked = true; }
    else if (k === "s") { const sh = d.shifts[+i]; if (!sh.members.includes(id)) sh.members.push(id); sh.locked = [...new Set([...sh.locked, id])]; }
    else if (k === "g") { const h = d.hours[+i]; if (!h.guards.includes(id)) h.guards.push(id); h.gLocked = [...new Set([...h.gLocked, id])]; }
    else { const h = d.hours[+i]; if (!h.carmelB.includes(id)) h.carmelB.push(id); h.bLocked = [...new Set([...h.bLocked, id])]; }
    return d;
  }
  // Every not-yet-finished slot of `fromId` on that day goes to `toId`.
  function replaceInDay(key, day, fromId, toId, now) {
    let d = normalize(day);
    for (const sl of slotsOf(key, d)) if (sl.t1 > now && holders(d, sl.ref).includes(fromId)) d = assignInDay(key, d, sl.ref, toId, fromId, now);
    return d;
  }
  // Move `id` from slot `fromRef` to slot `toRef` (kitchen duty: whoever held it is freed).
  function moveInDay(key, day, fromRef, toRef, id, now) {
    const d = normalize(day);
    removeFrom(d, fromRef, id);
    const cur = toRef === "k" ? d.kitchen : null;
    return assignInDay(key, d, toRef, id, cur && cur !== id ? cur : null, now);
  }
  // Per-soldier summary of what changed on one day: { id: { added:[text], removed:[text] } }
  function diffDay(key, oldDay, newDay) {
    const a0 = normalize(oldDay), b0 = normalize(newDay), ids = new Set();
    for (const d of [a0, b0]) if (d) { if (d.kitchen) ids.add(d.kitchen); d.shifts.forEach(sh => sh.members.forEach(x => ids.add(x))); d.hours.forEach(h => { h.guards.forEach(x => ids.add(x)); h.carmelB.forEach(x => ids.add(x)); }); }
    const txt = a => `${a.what} ${a.start.slice(11)}–${a.end.slice(11)}`;
    const out = {};
    for (const id of ids) {
      const a = new Set(assignmentsOf({ [key]: a0 || {} }, id).map(txt)), b = new Set(assignmentsOf({ [key]: b0 || {} }, id).map(txt));
      const added = [...b].filter(x => !a.has(x)), removed = [...a].filter(x => !b.has(x));
      if (added.length || removed.length) out[id] = { added, removed };
    }
    return out;
  }

  // Hard-rule check of a roster; returns { key: [problem, ...] }.
  function validate(input, docs) {
    const c = makeCtx(input), out = {}, iv = {};
    const nm = id => c.names[id] || "לוחם לא ידוע";
    const busy = (id, t0, t1, what, key) => { (iv[id] = iv[id] || []).push([t0, t1, what, key]); };
    for (const key of [...(input.days || [])].sort()) {
      const d = normalize(docs[key]), list = (out[key] = []);
      if (!d || (d.type !== "post" && d.type !== "patrol")) continue;
      const d1 = dayWindow(key, d.v)[1], d0 = dayStart(key, d);
      if (d1 <= c.now) continue; // finished days are history
      const chk = (id, t0, t1, lab) => {
        if (!c.stats[id]) list.push(`${lab}: ${nm(id)} לא בסד״כ הפעיל`);
        else if (t1 > c.now && !free(c, id, Math.max(t0, c.now), t1)) list.push(`${lab}: ${nm(id)} לא זמין`);
      };
      const reqCheck = (members, spec, lab) => {
        for (const q of spec.reqs) { const k = members.filter(id => has(c, id, q.r)).length; if (k < q.n) list.push(`${lab}: ${q.n - k > 1 ? `חסרים ${q.n - k}` : "חסר"} ${ROLE_LABEL[q.r]}`); }
        for (const [r, m] of Object.entries(spec.caps || {})) { const k = members.filter(id => has(c, id, r)).length; if (k > m) list.push(`${lab}: יותר מ־${m} ${ROLE_LABEL[r]}ים (${k})`); }
      };
      if (!d.kitchen) list.push("אין תורן מטבח"); else chk(d.kitchen, Math.max(d0, Math.min(c.now, d1)), d1, "תורן מטבח");
      for (const sh of d.shifts) {
        const t0 = T(sh.start), t1 = T(sh.end), lab = `${KIND_LABEL[sh.kind]} ${sh.start.slice(11)}`;
        const m = sh.members, n = d.v === V ? SIZE[sh.kind] : (sh.kind === "patrol" ? 7 : 8);
        if (t1 <= c.now) continue;
        if (m.length < n) list.push(`${lab}: חסרים ${n - m.length} לוחמים`);
        if (m.length > n) list.push(`${lab}: ${m.length - n} לוחמים מעבר לתקן`);
        if (new Set(m).size !== m.length) list.push(`${lab}: לוחם משובץ פעמיים`);
        if (d.v === V) reqCheck(m, SPEC[sh.kind], lab);
        if (d.kitchen && m.includes(d.kitchen)) list.push(`${lab}: תורן המטבח משובץ`);
        m.forEach(id => { chk(id, t0, t1, lab); busy(id, t0, t1, lab, key); });
      }
      for (const h of d.hours) {
        const t0 = T(h.start), t1 = Math.min(t0 + HOUR, d1), lab = `שעה ${h.start.slice(11)}`, hs = hourSpec(t0, d.v);
        if (t1 <= c.now) continue; // finished hours are history
        const sh = d.shifts.find(x => T(x.start) <= t0 && T(x.end) > t0);
        const A = sh ? sh.members : [];
        if (h.guards.length < hs.guards) list.push(`${lab}: ${hs.guards - h.guards.length > 1 ? `חסרים ${hs.guards - h.guards.length} שומרים` : "חסר שומר"} בעמדה`);
        if (h.guards.length > hs.guards) list.push(`${lab}: יותר מדי שומרים בעמדה`);
        for (const g of h.guards) {
          if (A.includes(g)) list.push(`${lab}: השומר (${nm(g)}) בכרמל חוץ`);
          if (g === d.kitchen && !kitchenMayGuard(t0, d.v)) list.push(`${lab}: תורן המטבח שומר (מותר רק 20:00–08:00)`);
          chk(g, t0, t1, `${lab} עמדה`); busy(g, t0, t1, `${lab} עמדה`, key);

    const opts = SCHED.slotsOf(k, d).filter(sl => sl.t1 > now && sl.ref !== cur && !SCHED.holders(d, sl.ref).includes(X) && !absentDuring(X, Math.max(sl.t0, now), sl.t1));
    const grp = (kinds, title) => { const o = opts.filter(sl => kinds.includes(sl.kind)); return o.length ? `<optgroup label="${title}">${o.map(sl => `<option value="${sl.ref}">${rng(sl.label)}${sl.kind === "kitchen" && d.kitchen ? ` (במקום ${esc(nameOf(d.kitchen))})` : ""}</option>`).join("")}</optgroup>` : ""; };
    body = opts.length ? `<div class="field"><label for="moveTo">להעביר את ${esc(nameOf(X))} אל</label><select id="moveTo" class="inp">${grp(["kitchen"], "מטבח")}${grp(["carmelA", "patrol"], "משמרות")}${grp(["guard"], "עמדה אחורית")}</select></div>
      <div class="muted" style="font-size:.85rem">${esc(nameOf(X))} ייצא מ${esc(lbl)} ויינעל במשימה החדשה. המקום שהתפנה ימולא אוטומטית.</div>
      <div class="actions"><button class="btn primary" data-act="movego">המשך לתצוגה מקדימה</button></div>` : `<div class="empty">אין משימה פנויה להעברה.</div>`;
  } else {

    const target = SCHED.slotsOf(k, d).find(sl => sl.ref === engineRef(S.swap.ref));
    const windows = tab === "replace" ? mine.map(sl => ({ t0: Math.max(sl.t0, Date.now()), t1: sl.t1 })) : [{ t0: Math.max(target.t0, Date.now()), t1: target.t1 }];
    body = `<div class="muted" style="font-size:.85rem">${tab === "replace" ? `המחליף ייכנס לכל המשימות של ${esc(nameOf(X))} היום${mine.length > 1 ? ` (${mine.length} משימות)` : ""} וינעל בהן. אם הוא משובץ במקום אחר באותן שעות, המקום שלו ימולא אוטומטית.` : `הלוחם שתבחר יינעל במשימה. אם הוא משובץ במקום אחר באותה שעה, המקום שלו ימולא אוטומטית.`}</div>
      <ul class="list picklist">${candidateRows(windows, X, mine.map(x => x.ref))}</ul>`;
  }
  const tabs = X ? `<div class="seg" role="group"><button data-stab="replace" aria-pressed="${tab === "replace"}">החלפה בלוחם אחר</button><button data-stab="move" aria-pressed="${tab === "move"}">העברה למשימה אחרת</button></div>` : "";
  smodal.innerHTML = wrap(`<div class="row"><h2 id="swt">${rng(lbl)}${X ? ` · ${esc(nameOf(X))}` : " · חסר"}</h2><button class="btn small ghost" data-act="sclose">סגירה</button></div>
    ${tabs}${X && S.swap.locked ? `<button class="btn small" data-act="unlock">שחרור הנעילה (המערכת תוכל להחליף)</button>` : ""}${body}`);
}
function makePreview(edited, title) {
  const k = S.schedDay, input = schedInput();
  const { docs } = SCHED.buildAll(input, { ...S.schedule, [k]: edited }, "repair", { rebuildAfter: k });
  const futureDays = Object.keys(docs).filter(x => x > k && canon(docs[x]) !== canon(S.schedule[x] || null)).length;
  S.swap.preview = { title, docs, diff: SCHED.diffDay(k, S.schedule[k], docs[k]), futureDays, problems: SCHED.validate(input, docs)[k] || [] };
  drawSwap();
}
async function unlockSlot() {
  const [kind, a, b] = S.swap.ref.split("|"), k = S.schedDay;
  const d = JSON.parse(JSON.stringify(S.schedule[k]));
  if (kind === "k") d.kitchenLocked = false;
  else if (kind === "s") d.shifts[+a].locked = (d.shifts[+a].locked || []).filter(x => x !== b);
  else if (kind === "g") d.hours[+a].gLocked = (d.hours[+a].gLocked || []).filter(x => x !== b);
  else d.hours[+a].bLocked = (d.hours[+a].bLocked || []).filter(x => x !== b);
  S.swap = null; drawSwap();
  await saveSchedule({ [k]: d }); toast("הנעילה שוחררה");
}
document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el || !S.swap || !S.isOwner) return;
  const d = el.dataset, k = S.schedDay, day = S.schedule[k], now = Date.now();
  if (d.stab) { S.swap.tab = d.stab; drawSwap(); return; }
  if (d.act === "sback") { S.swap.preview = null; drawSwap(); return; }
  if (d.pickid) {
    const X = slotHolder(S.swap.ref), Y = d.pickid;
    if (X) makePreview(SCHED.replaceInDay(k, day, X, Y, now), `${nameOf(Y)} במקום ${nameOf(X)}`);
    else makePreview(SCHED.assignInDay(k, day, engineRef(S.swap.ref), Y, null, now), `שיבוץ ${nameOf(Y)} ל${slotLabelOf(S.swap.ref)}`);
    return;
  }
  if (d.act === "movego") {
    const X = slotHolder(S.swap.ref), to = document.getElementById("moveTo").value;
    const toLabel = SCHED.slotsOf(k, day).find(sl => sl.ref === to).label;
    makePreview(SCHED.moveInDay(k, day, engineRef(S.swap.ref), to, X, now), `העברת ${nameOf(X)} ל${toLabel}`);
    return;
  }
  if (d.act === "sconfirm") {
    const docs = S.swap.preview.docs; S.swap = null; drawSwap();
    const n = await saveSchedule(docs); toast(n ? `השבצ״ק עודכן (${n} ימים)` : "אין שינוי");
    return;
  }
  if (d.act === "unlock") { await unlockSlot(); return; }
});

/* ---------- duty roster: events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button, [data-act='sclose']"); if (!el) return;
  const d = el.dataset;
  if (d.act === "sclose") { if (e.target !== el && el.classList.contains("overlay")) return; S.swap = null; drawSwap(); return; }
  if (d.sview) { S.schedView = d.sview; render(); return; }
  if (d.sday) { S.schedDay = d.sday; S.tab = "schedday"; render(); window.scrollTo(0, 0); return; }
  if (!S.isOwner) return;
  if (d.dtype) {
    const [k, t] = d.dtype.split("|");
    const dayTypes = { ...(S.schedSettings.dayTypes || {}), [k]: t };
    try { await write(db.doc("settings/schedule"), "set", { dayTypes }); toast(`${short(k)}: ${DAY_TYPE[t]}`); } catch (err) { toast(writeError(err)); }
    return;
  }
  if (d.act === "build") {
    const { docs } = SCHED.buildAll(schedInput(), {}, "rebuild");
    const n = await saveSchedule(docs); toast(`נבנה שבצ״ק ל־${n} ימים`); return;
  }
  if (d.act === "rebuild") {
    if (S.rebuildStep < 2) { S.rebuildStep++; render(); return; }
    S.rebuildStep = 0;
    const { docs } = SCHED.buildAll(schedInput(), S.schedule, "rebuild");
    const n = await saveSchedule(docs); toast(n ? `השבצ״ק נבנה מחדש (${n} ימים)` : "אין שינויים"); render(); return;
  }
  if (d.act === "rebuildcancel") { S.rebuildStep = 0; render(); return; }
  if (d.swap) {
    const [kind, a, b] = d.swap.split("|"); const day = S.schedule[S.schedDay];
    const locked = kind === "k" ? day.kitchenLocked : kind === "s" ? (day.shifts[+a].locked || []).includes(b) : kind === "g" ? (day.hours[+a].gLocked || []).includes(b) : (day.hours[+a].bLocked || []).includes(b);
    S.swap = { ref: d.swap, locked, tab: "replace", preview: null }; drawSwap(); return;
  }
  if (d.role) {
    const [sid, role] = d.role.split("|"); const s = S.soldiers.find(x => x.id === sid); if (!s) return;
    const roles = new Set(s.roles || []); roles.has(role) ? roles.delete(role) : roles.add(role);
    try { await write(db.collection("soldiers").doc(sid), "update", { roles: [...roles] }); } catch (err) { toast(writeError(err)); }
  }
});
document.addEventListener("change", e => { if (e.target.id === "myId") { S.myId = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.swap) { S.swap = null; drawSwap(); } });

/* ---------- open link for the fighters (encrypted roster on GitHub Pages) ---------- */
const ROSTER_URL = "https://abergil023.github.io/People-manage-/roster/";
S.publicLink = null; S.linkStep = 0;
function viewLinkPanel() {
  if (!S.isOwner) return "";
  const L = S.publicLink;
  const url = L && L.key ? `${ROSTER_URL}#k=${L.key}` : "";
  return `<div class="panel" id="linkPanel"><div class="row"><h2>קישור ללוחמים</h2><span class="chip c-present">צפייה בלבד</span></div>
    <div class="muted" style="font-size:.88rem">קישור שנפתח לכל מי שמקבל אותו, גם בלי חשבון. רואים בו רק את השבצ״ק: בלי יציאות, בלי סיבות ובלי תפקידים. השבצ״ק שם מוצפן, והמפתח נמצא רק בקישור עצמו. הוא מתעדכן אוטומטית פעם בשעה.</div>
    ${url ? `<div class="field"><label for="rosterUrl">הקישור</label><input id="rosterUrl" class="inp" dir="ltr" readonly value="${esc(url)}"></div>
      <div class="actions"><button class="btn primary" data-act="copylink">העתקת הקישור</button>
      <button class="btn danger" data-act="newlink">${["החלפת קישור", "בטוח? הקישור הנוכחי יפסיק לעבוד", "לחיצה אחרונה: להחליף"][S.linkStep]}</button>${S.linkStep ? `<button class="btn" data-act="newlinkcancel">ביטול</button>` : ""}</div>
      <div class="muted" style="font-size:.82rem">החלפה שימושית אם הקישור הגיע למי שלא צריך. הקישור החדש מתחיל לעבוד אחרי העדכון הבא (עד שעה).</div>`

function newKey() { const b = crypto.getRandomValues(new Uint8Array(32)); return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el || !S.isOwner) return;
  const a = el.dataset.act;
  if (a === "mklink" || (a === "newlink" && S.linkStep >= 2)) {
    S.linkStep = 0;
    try { await write(db.doc("secret/publicLink"), "set", { key: newKey(), createdAt: new Date().toISOString() }); toast(a === "mklink" ? "הקישור נוצר" : "הקישור הוחלף"); } catch (err) { toast(writeError(err)); }
    return;
  }
  if (a === "newlink") { S.linkStep++; render(); return; }
  if (a === "newlinkcancel") { S.linkStep = 0; render(); return; }
  if (a === "copylink") {
    const inp = document.getElementById("rosterUrl");
    try { await navigator.clipboard.writeText(inp.value); toast("הקישור הועתק"); } catch { inp.focus(); inp.select(); toast("סמנו והעתיקו ידנית"); }
  }
});

/* ---------- export a day of the roster as a PDF (drawn on canvas -> JPEG pages -> minimal PDF) ---------- */
function rosterPdfPages(key) {
  const d = SCHED.normalize(S.schedule[key]); if (!d) return [];
  const W = 1240, Hh = 1754, M = 70, inp = schedInput();
  const LRI = "⁦", PDI = "⁩";
  const pages = []; let cv, ctx, y;
  const font = (px, bold) => `${bold ? "700" : "400"} ${px}px Assistant, Rubik, Arial, "Noto Sans Hebrew", sans-serif`;
  const newPage = () => { cv = document.createElement("canvas"); cv.width = W; cv.height = Hh; ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, Hh); ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillStyle = "#1C2118"; pages.push(cv); y = M; };
  const ensure = h => { if (y + h > Hh - M) newPage(); };
  const wrap = (text, maxW, px, bold) => { ctx.font = font(px, bold); const words = String(text).split(" "), lines = []; let cur = ""; for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines.length ? lines : [""]; };
  const text = (t, x, px, bold, color) => { ctx.font = font(px, bold); ctx.fillStyle = color || "#1C2118"; ctx.fillText(t, x, y); };
  const rng = (a, b) => `${LRI}${a}–${b}${PDI}`;
  const names = ids => ids.map(nameOf).join(", ");
  newPage();
  text(`שבצ״ק – ${longDate(key)}`, W - M, 44, true); y += 62;
  const start = SCHED.fmt(SCHED.dayStart(key, d)).slice(11);
  text(`${DAY_TYPE[d.type]} · ${rng(start, d.v === SCHED.V ? "07:00" : "06:30")} למחרת · הופק ${LRI}${new Date().toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" })}${PDI}`, W - M, 24, false, "#5F6657"); y += 44;
  ctx.fillStyle = "#46572A"; ctx.fillRect(M, y, W - 2 * M, 4); y += 24;
  const block = (label, body) => { // title on its own line, names underneath
    const lines = wrap(body || "—", W - 2 * M, 26);
    ensure(40 + lines.length * 36 + 16);
    text(label, W - M, 26, true); y += 40;
    lines.forEach((l, i) => { ctx.font = font(26); ctx.fillStyle = "#1C2118"; ctx.fillText(l, W - M, y + i * 36); });
    y += lines.length * 36 + 14;
    ctx.fillStyle = "#D3D7C8"; ctx.fillRect(M, y - 7, W - 2 * M, 1);
  };
  if (d.type === "none") { block("משימות", "אין משימות ביום הזה"); return pages; }
  block("תורן מטבח", d.kitchen ? nameOf(d.kitchen) : "—");
  for (const sh of d.shifts) block(`${SCHED.KIND_LABEL[sh.kind]} ${rng(sh.start.slice(11), sh.end.slice(11))}`, names(sh.members));
  if (d.hours.length) {
    y += 10; ensure(120);
    text("עמדה אחורית ומי ללא משימה", W - M, 30, true); y += 50;
    const cTime = W - M, cG = W - M - 130, cF = W - M - 530, colF = cF - M;
    const head = () => { ctx.fillStyle = "#E7E9DF"; ctx.fillRect(M, y - 6, W - 2 * M, 44); text("שעה", cTime, 24, true); text("עמדה", cG, 24, true); text("ללא משימה", cF, 24, true); y += 46; };
    head();
    d.hours.forEach((h, i) => {
      const gl = wrap(names(h.guards) || "—", 380, 24, true), fl = wrap(names(SCHED.freeAt(inp, key, d, i)) || "—", colF, 21);
      const rowH = Math.max(gl.length * 32, fl.length * 28) + 14;
      if (y + rowH > Hh - M) { newPage(); head(); }
      text(h.start.slice(11), cTime, 24, true);
      gl.forEach((l, j) => { ctx.font = font(24, true); ctx.fillStyle = "#1C2118"; ctx.fillText(l, cG, y + j * 32); });
      fl.forEach((l, j) => { ctx.font = font(21); ctx.fillStyle = "#5F6657"; ctx.fillText(l, cF, y + j * 28); });
      y += rowH; ctx.fillStyle = "#D3D7C8"; ctx.fillRect(M, y - 7, W - 2 * M, 1);
    });
  }
  return pages;
}
function pdfFromCanvases(pages) {
  const enc = new TextEncoder(), parts = [], offsets = []; let len = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offsets[n] = len; push(`${n} 0 obj\n`); body(); push("\nendobj\n"); };
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const n = pages.length, kids = pages.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
  obj(1, () => push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  pages.forEach((cv, i) => {
    const pg = 3 + i * 3, im = pg + 1, ct = pg + 2;
    const jpg = Uint8Array.from(atob(cv.toDataURL("image/jpeg", 0.92).split(",")[1]), c => c.charCodeAt(0));
    const content = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pg, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(im, () => { push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push("\nendstream"); });
    obj(ct, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  });
  const total = 3 + n * 3, xref = len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) push(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(len); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
async function exportDayPdf(key) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
  const bytes = pdfFromCanvases(rosterPdfPages(key));
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (!dl) { toast("ההורדה לא זמינה בתצוגה הזו. פתחו את האפליקציה ב־claude.ai."); return; }
  try { await dl.save({ filename: `shabtzak-${key}.pdf`, data: new Blob([bytes], { type: "application/pdf" }) }); toast("קובץ ה־PDF מוכן"); }
  catch (e) { if (e && e.code !== "declined") toast("השמירה לא הצליחה. נסו שוב."); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-act='pdf']"); if (b && S.schedDay) exportDayPdf(S.schedDay); });

init();
</script>
