name: Security tests

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Install Playwright (Chromium)
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Dependency audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Firestore rules tests (cross-user isolation, validation)
        run: npm run test:rules
      - name: App security tests (XSS, CSP, logout, clickjacking, regression)
        run: npm run test:web
