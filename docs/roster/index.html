<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#46572A">
<title>שבצ״ק הצוות</title>
<style id="antiClickjack">body{display:none !important}</style>
<style>
:root { --bg:#F1F2EC; --surface:#FFFFFF; --surface-2:#E7E9DF; --ink:#1C2118; --muted:#5F6657; --line:#D3D7C8; --accent:#46572A; --accent-ink:#FFFFFF; --khaki:#8B6F47; --bad:#B3261E; --bad-bg:#F7D9D5; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#15180F; --surface:#1F2418; --surface-2:#2A3021; --ink:#E8EADF; --muted:#A3A995; --line:#3A4130; --accent:#A9C17A; --accent-ink:#15180F; --khaki:#C9A878; --bad:#F08A80; --bad-bg:#47201C; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Assistant", "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 16px; line-height: 1.45; }
.top { background: var(--accent); color: var(--accent-ink); padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
.top b { font-size: 1.15rem; } .top small { display: block; opacity: .85; font-size: .8rem; }
main { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
h2 { font-size: 1.05rem; margin: 0; }
.muted { color: var(--muted); font-size: .88rem; }
label { font-size: .82rem; font-weight: 700; color: var(--muted); }
select { font: inherit; color: inherit; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
details summary { cursor: pointer; font-weight: 700; }
.lbl { font-size: .8rem; font-weight: 700; color: var(--muted); }
.row2 { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 8px; font-size: .86rem; font-weight: 600; }
.chip.free { background: transparent; color: var(--muted); border-style: dotted; font-weight: 500; }
.chip.me { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.htable { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.hrow { display: grid; grid-template-columns: 3.2rem minmax(0, 8rem) minmax(0, 1fr); gap: 6px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--line); }
.hrow.head { border-top: 0; background: var(--surface-2); font-size: .78rem; font-weight: 700; color: var(--muted); }
.item { display: grid; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.err { background: var(--bad-bg); color: var(--ink); border-radius: 12px; padding: 14px; }
.num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="top"><b>שבצ״ק הצוות</b><small id="upd">צפייה בלבד</small></header>
<main id="app"><div class="panel muted">טוען…</div></main>
<script src="roster.js"></script>
</body>
</html>
